# QuietSentry · SonarQube 扫描配置
# 仅描述“扫描哪些源码”，凭据由环境变量 SONAR_TOKEN 注入，不写入本文件。
sonar.projectKey=QuietSentry
sonar.projectName=QuietSentry
sonar.projectVersion=0.1.0

sonar.sources=app/src/main/java
sonar.sourceEncoding=UTF-8

# 构建产物、资源与脚本文档不属于代码质量扫描范围
sonar.exclusions=**/build/**,**/.gradle/**,**/.kotlin/**,release/**,docs/**,tools/**,assets/**

# 本机仓库无 SCM blame 数据，关闭以缩短扫描时间
sonar.scm.disabled=true

# Kotlin 分析需要编译产物；由 scripts/安卓构建打包.bat 或 gradle assembleDebug 生成
# 路径跟随 gradle.properties 的 qs.buildDir：构建目录已收口到 release/.build/app
sonar.java.binaries=release/.build/app/tmp/kotlin-classes/debug

# 单元测试覆盖率由 gradle jacocoTestReport 生成；Sonar 只读报告，不做二次插桩
sonar.coverage.jacoco.xmlReportPaths=release/.build/app/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# Scanner 工作目录同样收进 release/.build，避免项目根再冒出一个 .scannerwork
sonar.working.directory=release/.build/scannerwork
