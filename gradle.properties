# Kotlin 编译策略：本机 daemon 反复启动失败（先是 persistent.dir 路径异常，后是
# GC 自动选择导致 daemon 以 error code 0 意外退出、4 次重连失败）。改用 in-process
# 让编译在 Gradle 进程内执行，彻底绕开 daemon 连接环节。实测全量重编成功。
# 因此把 Gradle 堆从 2g 提到 3g，给 in-process 编译留足空间（本机内存充足）。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 可重建产物统一收口：Gradle 构建目录（编译中间产物、报告、APK）与 Kotlin 会话缓存
# 都挂在项目根 release/.build 下，删掉整个 release/ 就等于全量清理，下一次构建自动重建。
# 前缀只写在这一行：Gradle 侧由 build.gradle.kts 读取，PowerShell 侧由 build-lib.ps1 读取，
# 两边共用同一个来源，避免「Gradle 写到 A、脚本去 B 找产物」。
qs.buildDir=release/.build
kotlin.project.persistent.dir=release/.build/kotlin

# 关闭 release 变体的资源路径优化（AGP 8 默认开启，会把 res/mipmap-xxhdpi-v4/ic_launcher.png
# 这类常规路径改写成 res/Ck.png、res/BW.xml 等短名，并合并同名资源）。这样一来，只有
# resources.arsc 能反解出图标；按常规路径取图的第三方程序（手机文件管理器、第三方安装器、
# 压缩/解包工具、Windows 端 APK 图标提取器）在一键发布的 release 包上取不到图标，看起来
# 就是「没有 logo」，而 debug 包因为不做这一步，路径完整、图标正常。本项目未开代码混淆，
# 这点体积收益不值得换来外部工具取不到图标。
android.enableResourceOptimizations=false

# 依赖版本外置，避免构建脚本里散落版本号
depCoreKtxVersion=1.13.1
depAppcompatVersion=1.7.0
depCameraXVersion=1.4.1
depLifecycleVersion=2.8.7
# 二维码生成：zxing core 是纯 Java 无传递依赖，只用于把配对链接画成二维码
depZxingVersion=3.5.3
