org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 可重建产物统一收口：Gradle 构建目录（编译中间产物、报告、APK）与 Kotlin 会话缓存
# 都挂在项目根 release/.build 下，删掉整个 release/ 就等于全量清理，下一次构建自动重建。
# 前缀只写在这一行：Gradle 侧由 build.gradle.kts 读取，PowerShell 侧由 build-lib.ps1 读取，
# 两边共用同一个来源，避免「Gradle 写到 A、脚本去 B 找产物」。
qs.buildDir=release/.build
kotlin.project.persistent.dir=release/.build/kotlin

# 依赖版本外置，避免构建脚本里散落版本号
depCoreKtxVersion=1.13.1
depAppcompatVersion=1.7.0
depCameraXVersion=1.4.1
depLifecycleVersion=2.8.7
# 二维码生成：zxing core 是纯 Java 无传递依赖，只用于把配对链接画成二维码
depZxingVersion=3.5.3
